---
# Install Ludus inside a standard (non-nested) Debian 12/13 VM while targeting
# an outer Proxmox VE 8/9 standalone host or cluster strictly over HTTPS (:8006).
# Proxmox roles, groups, pools, SDN zone + ludusnat VNet, and ACLs have already
# been bootstrapped via ludusapi.BootstrapRemoteProxmox before this playbook runs.

- name: Configure Ludus Remote Proxmox Controller VM (Stage 1 - Networking & Base Packages)
  hosts: localhost
  serial: 1
  pre_tasks:
    - name: Set install path and interface defaults
      ansible.builtin.set_fact:
        ludus_install_path: "{{ install_path | default('/opt/ludus') }}"
        pve_interface: "{{ proxmox_interface | default(ansible_default_ipv4.interface) }}"
        ludus_nat_interface: "{{ ludus_nat_interface | default('ludusnat') }}"
  tasks:
    - name: Setup ludus-install-status script
      ansible.builtin.template:
        src: ludus-install-status.sh.j2
        dest: /usr/local/bin/ludus-install-status
        mode: '0755'

    - name: Install required system and network packages in Ludus VM (excluding dnsmasq until ludusnat is configured)
      ansible.builtin.apt:
        name:
          - bridge-utils
          - ifupdown
          - git
          - python3-pip
          - jq
          - curl
          - gpg-agent
          - dbus
          - dbus-user-session
          - vim
          - iptables
          - iptables-persistent
          - sshpass
          - python3-debian
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Remove python EXTERNALLY-MANAGED files using shell find
      ansible.builtin.shell:
        cmd: find /usr/lib/python*/EXTERNALLY-MANAGED -type f -delete
        executable: /bin/bash
      register: find_delete_result
      changed_when: find_delete_result.rc == 0
      failed_when: >
        find_delete_result.rc != 0 and
        not ('No such file or directory' in find_delete_result.stderr and
            'EXTERNALLY-MANAGED' in find_delete_result.stderr)

    - name: Install required python packages (for ansible/proxmox HTTPS interoperability)
      ansible.builtin.pip:
        name:
          - proxmoxer
          - requests
          - netaddr
          - pywinrm
          - dnspython
          - jmespath
        extra_args: --ignore-installed

    - name: Ensure /etc/ansible directory exists
      ansible.builtin.file:
        path: /etc/ansible
        state: directory
        mode: '0755'

    - name: Set configuration in /etc/ansible/ansible.cfg
      ansible.builtin.copy:
        dest: /etc/ansible/ansible.cfg
        content: |
          [defaults]
          no_target_syslog = True
          timeout = 60
        mode: '0644'

    - name: Auto-detect secondary guest NIC attached to Proxmox ludusnat VNet
      ansible.builtin.set_fact:
        detected_nat_guest_nic: >-
          {{
            ludus_nat_guest_interface
            if (ludus_nat_guest_interface is defined and (ludus_nat_guest_interface | trim) != '')
            else (
              (
                ansible_interfaces
                | reject('in', ['lo', pve_interface, ludus_nat_interface])
                | select('match', '^(ens|eth|enp|eno)[0-9a-zA-Z]+$')
                | sort
                | list
                | first
              ) | default('none')
            )
          }}

    - name: Detect guest NIC MTU for ludusnat transit bridge (preserves VXLAN 1450 MTU when set on outer VNet)
      ansible.builtin.set_fact:
        effective_nat_mtu: >-
          {{
            (ludus_nat_mtu | int)
            if (ludus_nat_mtu is defined and (ludus_nat_mtu | string | trim) != '')
            else (
              (ansible_facts.get(detected_nat_guest_nic | trim, {}).get('mtu', 0) | int)
              if (detected_nat_guest_nic | trim != 'none' and detected_nat_guest_nic | trim != ludus_nat_interface)
              else 0
            )
          }}

    - name: Ensure /etc/network/interfaces sources interfaces.d
      ansible.builtin.lineinfile:
        path: /etc/network/interfaces
        line: "source /etc/network/interfaces.d/*"
        create: true
        mode: '0644'

    - name: Ensure /etc/network/interfaces.d directory exists
      ansible.builtin.file:
        path: /etc/network/interfaces.d
        state: directory
        mode: '0755'

    - name: Configure local ludusnat transit bridge inside Ludus VM
      ansible.builtin.blockinfile:
        path: /etc/network/interfaces
        marker: "# LUDUS NAT INTERFACE {mark}"
        block: |
          {% if detected_nat_guest_nic | trim != 'none' and detected_nat_guest_nic | trim != ludus_nat_interface %}
          auto {{ detected_nat_guest_nic | trim }}
          iface {{ detected_nat_guest_nic | trim }} inet manual
          {% if (effective_nat_mtu | int) > 0 %}
              mtu {{ effective_nat_mtu | int }}
          {% endif %}
          {% endif %}
          auto {{ ludus_nat_interface }}
          iface {{ ludus_nat_interface }} inet static
              address 192.0.2.254/24
              bridge-ports {{ detected_nat_guest_nic | trim if (detected_nat_guest_nic | trim != ludus_nat_interface) else 'none' }}
              bridge-stp off
              bridge-fd 0
              bridge-vlan-aware yes
              bridge-vids 2-4094
          {% if (effective_nat_mtu | int) > 0 %}
              mtu {{ effective_nat_mtu | int }}
          {% endif %}
              post-up echo 1 > /proc/sys/net/ipv4/ip_forward
              post-up   iptables -t nat -C POSTROUTING -s '192.0.2.0/24' -o {{ pve_interface }} -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s '192.0.2.0/24' -o {{ pve_interface }} -j MASQUERADE
              post-down iptables -t nat -D POSTROUTING -s '192.0.2.0/24' -o {{ pve_interface }} -j MASQUERADE 2>/dev/null || true
        state: present

    - name: Bring up ludusnat transit interface and enable IPv4 forwarding + NAT
      ansible.builtin.shell: |
        set -e
        sysctl -w net.ipv4.ip_forward=1 >/dev/null
        if [ "{{ detected_nat_guest_nic | trim }}" != "none" ] && [ "{{ detected_nat_guest_nic | trim }}" != "{{ ludus_nat_interface }}" ]; then
          ip link set "{{ detected_nat_guest_nic | trim }}" up || true
        fi
        ADDRFAM=inet ifup {{ ludus_nat_interface }} || true
        if ! ip link show "{{ ludus_nat_interface }}" >/dev/null 2>&1; then
          ip link add name "{{ ludus_nat_interface }}" type bridge vlan_filtering 1
        fi
        if [ "{{ detected_nat_guest_nic | trim }}" != "none" ] && [ "{{ detected_nat_guest_nic | trim }}" != "{{ ludus_nat_interface }}" ]; then
          ip link set "{{ detected_nat_guest_nic | trim }}" master "{{ ludus_nat_interface }}" 2>/dev/null || true
        fi
        if [ "{{ effective_nat_mtu | int }}" -gt 0 ]; then
          ip link set "{{ ludus_nat_interface }}" mtu "{{ effective_nat_mtu | int }}" || true
        fi
        ip link set "{{ ludus_nat_interface }}" up
        ip addr replace 192.0.2.254/24 dev "{{ ludus_nat_interface }}"
        iptables -t nat -C POSTROUTING -s '192.0.2.0/24' -o {{ pve_interface }} -j MASQUERADE 2>/dev/null || \
          iptables -t nat -A POSTROUTING -s '192.0.2.0/24' -o {{ pve_interface }} -j MASQUERADE
      args:
        executable: /bin/bash

    - name: Ensure /etc/dnsmasq.d directory exists before package install
      ansible.builtin.file:
        path: /etc/dnsmasq.d
        state: directory
        mode: '0755'

    - name: Configure dnsmasq (part 1) - pre-stage bind-interfaces base config
      ansible.builtin.template:
        src: dnsmasq.conf.j2
        dest: /etc/dnsmasq.conf

    - name: Configure dnsmasq (part 2) - pre-stage ludusnat interface config
      ansible.builtin.template:
        src: dnsmasq-interface.conf.j2
        dest: "/etc/dnsmasq.d/dnsmasq-{{ pve_interface }}.conf"

    - name: Install dnsmasq after ludusnat and bind-interfaces config are ready
      ansible.builtin.apt:
        name: dnsmasq
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Configure dnsmasq (part 3) - enable and restart service
      ansible.builtin.service:
        name: dnsmasq
        enabled: true
        state: restarted

- name: Configure Ludus Remote Proxmox Controller VM (Stage 2 & 3 - Packer, WireGuard, Users & Services)
  hosts: localhost
  pre_tasks:
    - name: Set install path and WireGuard defaults
      ansible.builtin.set_fact:
        ludus_install_path: "{{ install_path | default('/opt/ludus') }}"
        pve_interface: "{{ proxmox_interface | default(ansible_default_ipv4.interface) }}"
        ludus_nat_interface: "{{ ludus_nat_interface | default('ludusnat') }}"
  roles:
    - role: geerlingguy.packer
      packer_version: "1.9.4"
  vars:
    wg_port: "{{ wireguard_port | default(51820) }}"
    server_cidr: "198.51.100.1/24"
  tasks:
    - name: Install proxmox and ansible packer plugins
      ansible.builtin.shell: |
        PACKER_PLUGIN_PATH={{ ludus_install_path }}/resources/packer/plugins packer plugins install github.com/badsectorlabs/proxmox v{{ packer_proxmox_plugin_version | default('1.2.3') }}
        PACKER_PLUGIN_PATH={{ ludus_install_path }}/resources/packer/plugins packer plugins install github.com/hashicorp/ansible v1.1.1
      register: packer_plugin_install

    - name: Ensure group "pveusers" exists
      ansible.builtin.group:
        name: pveusers
        state: present

    - name: Setup WireGuard VPN server
      ansible.builtin.include_tasks: tasks/setup-wg.yml

    - name: Ensure group "ludus" exists
      ansible.builtin.group:
        name: ludus
        state: present

    - name: Create the ludus service user
      ansible.builtin.user:
        name: ludus
        shell: /bin/bash
        groups:
          - ludus
        append: true
      register: created_user

    - name: Create Ludus runtime directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ ludus_install_path }}/users"
        - "{{ ludus_install_path }}/users/root"
        - "{{ ludus_install_path }}/db"
        - "{{ ludus_install_path }}/db/storage"
        - "{{ ludus_install_path }}/blueprints"
        - "{{ ludus_install_path }}/sources"

    - name: Chown install directory to ludus user
      ansible.builtin.file:
        dest: "{{ ludus_install_path }}"
        owner: ludus
        group: ludus
        recurse: true

    - name: Restore root-only ownership on install directory contents
      ansible.builtin.file:
        path: "{{ ludus_install_path }}/install"
        state: directory
        owner: root
        group: root
        recurse: true

    - name: Enforce traverse-only mode on install directory
      ansible.builtin.file:
        path: "{{ ludus_install_path }}/install"
        state: directory
        owner: root
        group: root
        mode: '0711'

    - name: Stat default Proxmox admin password file in install directory
      ansible.builtin.stat:
        path: "{{ ludus_install_path }}/install/proxmox-admin-password"
      register: default_proxmox_pw_stat

    - name: Enforce 0600 root:root on default Proxmox admin password file if present
      ansible.builtin.file:
        path: "{{ ludus_install_path }}/install/proxmox-admin-password"
        owner: root
        group: root
        mode: '0600'
      when: default_proxmox_pw_stat.stat.exists

    - name: Enforce 0600 root:root on Proxmox admin password file if present
      ansible.builtin.file:
        path: "{{ proxmox_admin_password_file }}"
        owner: root
        group: root
        mode: '0600'
      when:
        - proxmox_admin_password_file is defined
        - (proxmox_admin_password_file | trim) != ''

    - name: Enforce 0600 root:root on Proxmox root token file if present
      ansible.builtin.file:
        path: "{{ proxmox_root_token_file }}"
        owner: root
        group: root
        mode: '0600'
      when:
        - proxmox_root_token_file is defined
        - (proxmox_root_token_file | trim) != ''

    - name: Install collections and roles together for the root user (used to create other users)
      ansible.builtin.shell:
        cmd: |
          ANSIBLE_HOME={{ ludus_install_path }}/users/root/.ansible ansible-galaxy install -r {{ ludus_install_path }}/ansible/requirements.yml

    - name: Ensure ludus user can copy root .ansible cache for new users
      ansible.builtin.file:
        path: "{{ ludus_install_path }}/users/root"
        owner: ludus
        group: ludus
        recurse: true

    - name: Create systemd service file for ludus admin
      ansible.builtin.template:
        src: ludus-admin.service.j2
        dest: "/etc/systemd/system/ludus-admin.service"
        owner: root
        group: root
        mode: '0644'

    - name: Create systemd service file for ludus
      ansible.builtin.template:
        src: ludus.service.j2
        dest: "/etc/systemd/system/ludus.service"
        owner: root
        group: root
        mode: '0644'

    - name: Restart dnsmasq
      ansible.builtin.service:
        name: dnsmasq
        state: restarted

    - name: Drop a file to indicate stage 3 is complete
      ansible.builtin.file:
        path: "{{ ludus_install_path }}/install/.stage-3-complete"
        state: touch
        owner: root
        group: root
        mode: '0644'

    - name: Start and enable the ludus admin service
      ansible.builtin.systemd:
        name: ludus-admin.service
        state: started
        enabled: true
        daemon_reload: true

    - name: Pause to allow the admin service to initialize database and TLS certs
      ansible.builtin.pause:
        seconds: 5

    - name: Start and enable the ludus service
      ansible.builtin.systemd:
        name: ludus.service
        state: started
        enabled: true
        daemon_reload: true
        enabled: true
        daemon_reload: true

    - name: Pause to allow the admin service to bootstrap ROOT, SDN, and TLS cert
      ansible.builtin.pause:
        seconds: 5

    - name: Start the ludus service
      ansible.builtin.service:
        name: ludus
        state: started
        enabled: true
        daemon_reload: true

    - name: Alert
      ansible.builtin.pause:
        prompt: |
          Ludus Remote Proxmox VM install complete.
        seconds: 1
